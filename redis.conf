# Redis configuration for Dhan Algo Trading Platform
# Redis is used as a transient cache / pub-sub bus.
# Persistence is NOT required — PostgreSQL is the authoritative store.

# Disable RDB snapshots entirely (avoids disk-write errors)
save ""

# Do not block writes if RDB save fails
stop-writes-on-bgsave-error no

# Disable AOF persistence (not needed for cache/pub-sub use case)
appendonly no

# Max memory policy: evict least-recently-used keys when full
maxmemory 256mb
maxmemory-policy allkeys-lru

# Bind to all network interfaces so other docker containers can connect
bind 0.0.0.0

# Log level
loglevel warning
